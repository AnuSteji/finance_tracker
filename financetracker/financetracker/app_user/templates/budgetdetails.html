{% load static %}
{% include 'Layout/Partials/User/header.html' %}

<div class="body-wrapper-inner">
  <div class="container-fluid">
    <div class="card shadow-sm">
      <div class="card-body">
        <div>
        <h5 class="card-title fw-semibold mb-4"></h5>

        <form action="{% url 'user:budgetdetails' %}" method="POST">
          {% csrf_token %}
          <br><br><br><br>
          


          <div class="mb-3">
            <label class="form-label">Expensehead</label>
            <select name="expensehead" class="form-control">
              <option value="">Select Expensehead</option>
              {% for i in expensehead %}
              <option value="{{i.id}}">{{i.name}}</option>
              {% endfor %}
            </select>
            <div id="nameHelp" class="form-text"></div>
            
          </div>
           <div class="mb-3">
            <label class="form-label">Month</label>
            <input type="text" name="month" class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label">Amount </label>
            <input type="text" name="amount" class="form-control">
          </div>

          <button type="submit" class="btn btn-primary w-100">Save Budget</button>

        </form>
        </div>
</div>
      </div>
    </div>
  </div>
</div>
{% include 'Layout/Partials/User/footer.html' %}
