{% load static %}
{% include 'Layout/Partials/User/header.html' %}

<div class="body-wrapper-inner">
<div class="container-fluid">

<br><br><br><br><br>

<!-- Month Selection -->
<form method="GET">
<div class="row mb-4">
<div class="col-md-4">

<select name="month" class="form-control" onchange="this.form.submit()">

<option value="">Select Month</option>

<option value="1" {% if selected_month == "1" %}selected{% endif %}>January</option>
<option value="2" {% if selected_month == "2" %}selected{% endif %}>February</option>
<option value="3" {% if selected_month == "3" %}selected{% endif %}>March</option>
<option value="4" {% if selected_month == "4" %}selected{% endif %}>April</option>
<option value="5" {% if selected_month == "5" %}selected{% endif %}>May</option>
<option value="6" {% if selected_month == "6" %}selected{% endif %}>June</option>
<option value="7" {% if selected_month == "7" %}selected{% endif %}>July</option>
<option value="8" {% if selected_month == "8" %}selected{% endif %}>August</option>
<option value="9" {% if selected_month == "9" %}selected{% endif %}>September</option>
<option value="10" {% if selected_month == "10" %}selected{% endif %}>October</option>
<option value="11" {% if selected_month == "11" %}selected{% endif %}>November</option>
<option value="12" {% if selected_month == "12" %}selected{% endif %}>December</option>

</select>

</div>
</div>
</form>


<!-- Summary Cards -->

<div class="row mb-4">

<div class="col-md-4">
<div class="card bg-success text-white text-center">
<div class="card-body">
<h5>Total Income</h5>
<h3>₹{{ total_income }}</h3>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card bg-primary text-white text-center">
<div class="card-body">
<h5>Total Budget</h5>
<h3>₹{{ total_budget }}</h3>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card bg-warning text-dark text-center">
<div class="card-body">
<h5>Remaining Income</h5>
<h3>₹{{ remaining_income }}</h3>
</div>
</div>
</div>

</div>



<!-- Budget Form -->

<div class="row justify-content-center">
<div class="col-md-6">

<div class="card shadow-sm">
<div class="card-body">

<h5 class="text-center mb-4">Set Budget</h5>

<form method="POST">
{% csrf_token %}

<div class="mb-3">
<label>Expense Head</label>

<select name="expensehead" class="form-control">

<option value="">Select Expensehead</option>

{% for i in expensehead %}
<option value="{{i.id}}">{{i.name}}</option>
{% endfor %}

</select>

</div>


<div class="mb-3">
<label>Month</label>

<select name="month" class="form-control">

<option value="">Select Month</option>

<option value="1">January</option>
<option value="2">February</option>
<option value="3">March</option>
<option value="4">April</option>
<option value="5">May</option>
<option value="6">June</option>
<option value="7">July</option>
<option value="8">August</option>
<option value="9">September</option>
<option value="10">October</option>
<option value="11">November</option>
<option value="12">December</option>

</select>

</div>


<div class="mb-3">
<label>Amount</label>
<input type="number" name="amount" class="form-control">
</div>

<button class="btn btn-primary w-100">Save Budget</button>

</form>

</div>
</div>

</div>
</div>

</div>
</div>

{% include 'Layout/Partials/User/footer.html' %}
