<div class="row justify-content-center mt-4">
  <div class="col-md-7">

    <div class="card shadow-lg border-0">

      <!-- Header -->
      <div class="card-header bg-primary text-white text-center">
        <h4 class="mb-0 fw-bold">Income Details</h4>
      </div>

      <!-- Navigation Section -->
      <div class="card-body pb-0 text-center">

        <div class="d-flex justify-content-center gap-3 mb-4">

          <a href="{% url 'user:budgetdetails' %}" 
             class="btn btn-outline-success px-4 fw-semibold">
             Budget Details
          </a>

          <a href="{% url 'user:viewdetails' %}" 
             class="btn btn-outline-info px-4 fw-semibold">
             View Income
          </a>

        </div>

        <!-- Income Form -->
        <form action="{% url 'user:incomedetails' %}" method="POST">
          {% csrf_token %}

          <div class="mb-3 text-start">
            <label class="form-label fw-semibold">Income Head</label>
            <select name="incomehead" class="form-select">
              <option value="">Select Income Head</option>
              {% for i in incomehead %}
              <option value="{{i.id}}">{{i.namefield}}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3 text-start">
            <label class="form-label fw-semibold">Date</label>
            <input type="date" name="date" class="form-control">
          </div>

          <div class="mb-4 text-start">
            <label class="form-label fw-semibold">Amount</label>
            <input type="number" name="amount" class="form-control">
          </div>

          <button type="submit" class="btn btn-primary w-100 fw-semibold">
            Save Income
          </button>

        </form>

      </div>
    </div>

  </div>
</div>
