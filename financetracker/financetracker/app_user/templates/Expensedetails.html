<!-- Alert Messages -->
{% if messages %}
<div class="row justify-content-center">
  <div class="col-md-6">
    {% for message in messages %}
    <div class="alert alert-info alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  </div>
</div>
{% endif %}

<!-- Expense Form -->
<div class="row justify-content-center mt-3">
  <div class="col-md-6">

    <div class="card shadow-sm">
      <div class="card-body">

        <h5 class="card-title fw-semibold text-center mb-4">
          Expense Details
        </h5>

        <form action="{% url 'user:expensedetails' %}" method="POST">
          {% csrf_token %}

          <!-- Date -->
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" name="date" class="form-control" required>
          </div>

          <!-- Expense Head -->
          <div class="mb-3">
            <label class="form-label">Expense Head</label>
            <select name="expensehead" class="form-select" required>
              <option value="">Select Expense Head</option>
              {% for i in expensehead %}
              <option value="{{ i.id }}">{{ i.name }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Description -->
          <div class="mb-3">
            <label class="form-label">Description</label>
            <input type="text"
                   name="description"
                   class="form-control"
                   placeholder="Enter description">
          </div>

          <!-- Amount -->
          <div class="mb-4">
            <label class="form-label">Amount</label>
            <input type="number"
                   name="amount"
                   class="form-control"
                   placeholder="Enter amount"
                   required>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-primary w-100">
            Save Expense
          </button>

        </form>

      </div>
    </div>

  </div>
</div>
