{% load static %}
{% include 'Layout/Partials/User/header.html' %}

<div class="body-wrapper-inner">
  <div class="container-fluid">
<br><br><br>
    <div class="row justify-content-center mt-5">
      <div class="col-md-6">

        <div class="card shadow-sm">
          <div class="card-body">

            <h5 class="card-title fw-semibold text-center mb-4">Expense Details</h5>

            <form action="{% url 'user:expensedetails' %}" method="POST">
              {% csrf_token %}

              <div class="mb-3">
                <label class="form-label">Expense Head</label>
                <select name="expensehead" class="form-select">
                  <option value="">Select Expensehead</option>
                  {% for i in expensehead %}
                  <option value="{{i.id}}">{{i.name}}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Description</label>
                <input type="text" name="description" class="form-control" placeholder="Enter description">
              </div>

              <div class="mb-3">
                <label class="form-label">Date</label>
                <input type="date" name="date" class="form-control">
              </div>

              <div class="mb-3">
                <label class="form-label">Amount</label>
                <input type="number" name="amount" class="form-control" placeholder="Enter amount">
              </div>

              <button type="submit" class="btn btn-primary w-100">
                Save Expense
              </button>

            </form>

          </div>
        </div>

      </div>
    </div>

  </div>
</div>

{% include 'Layout/Partials/User/footer.html' %}
