
  {% load static %}
  {% include 'Layout/Partials/Admin/header.html' %}
  <div class="body-wrapper-inner">
        <div class="container-fluid">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title fw-semibold mb-4">Forms</h5>
              <div class="card">
                <div class="card-body">
                  <form method="POST" action="{% url 'core:editcat' catv.id %}" enctype="multipart/form-data">
			{% csrf_token %} 
                    <div class="mb-3">
                      <label for="exampleInputcatname" class="form-label">Category Name</label>
                      <input type="text" class="form-control" id="exampleInputcatname" name="name"  aria-describedby="nameHelp" value={{catv.name}}>
                      <div id="nameHelp" class="form-text"></div>
                    </div>
                    <div class="mb-3">
                      <label for="exampleInputdescription" class="form-label">Description</label>
                      <input type="text" class="form-control" id="exampleInputdescription" name="description" value={{catv.description}}>
                    </div>
                    <div class="mb-3">
                      <img src="/media/{{catv.img}}" alt="">
                      <label for="exampleInputdescription" class="form-label">Image</label>
                      <input type="file" class="form-control" id="exampleInputdescription" name="img">
                    
                    <button type="submit" class="btn btn-primary">Submit</button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
</div>
      {% include 'Layout/Partials/Admin/footer.html' %}
