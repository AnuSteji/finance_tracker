{% load static %}
{% include 'Layout/Partials/Admin/header.html' %}

      <div>
        <h4 class="card-title fw-bold">Details View</h4>
        <p class="card-subtitle text-muted">Finance Tracking – Expense List</p>
      </div>

      <div class="ms-auto">
        <select class="form-select theme-select border-0 shadow-sm" style="width:160px;">
          <option>March 2025</option>
          <option>April 2025</option>
          <option>May 2025</option>
        </select>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">

        <div class="table-responsive mt-2">
          <table class="table align-middle mb-0 text-nowrap varient-table fs-6" style="table-layout:fixed;">
            <thead>
              <tr>
                <th class="px-2 text-muted" style="width:60px;">No.</th>
                <th class="px-2 text-muted" style="width:180px;">Name</th>
                <th class="px-2 text-muted" style="width:380px;">Description</th>
                <th class="text-muted text-center" style="width:150px;">Actions</th>
              </tr>
            </thead>

            <tbody>
              {% for i in list %}
              <tr>
                <td class="px-2 fw-semibold">{{ forloop.counter }}</td>
                <td class="px-2">{{ i.name }}</td>

                <td class="px-2" style="white-space:normal; width:380px; font-size:14px; line-height:1.4; padding-right:10px;">
                  {{ i.description }}
                </td>

                <td class="px-2 text-center">
                  <a href="{% url 'core:deleteexpense' i.id %}">
                    <button class="btn btn-danger btn-sm me-2">Delete</button>
                  </a>
                  <a href="{% url 'core:editexpense' i.id %}">
                    <button class="btn btn-secondary btn-sm">Edit</button>
                  </a>
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>

      </div>
    </div>

  </div>
</div>

{% include 'Layout/Partials/Admin/footer.html' %}
