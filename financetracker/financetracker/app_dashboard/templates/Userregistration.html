{% load static %}
{% include 'Layout/Partials/Guest/header.html' %}

<style>
  body {
    background-color: #f8fafc;
    font-family: 'Segoe UI', sans-serif;
  }

  .register-container {
    min-height: 100vh;
  }

  .finance-card {
    border-radius: 12px;
    border: none;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  }

  .finance-title {
    font-weight: 600;
    color: #1e293b;
  }

  label {
    font-weight: 600;
    margin-bottom: 6px;
    color: #334155;
  }

  .form-control,
  .form-select {
    border-radius: 8px;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
  }

  .form-control:focus,
  .form-select:focus {
    border-color: #2563eb;
    box-shadow: none;
  }

  .btn-primary {
    background-color: #2563eb;
    border: none;
    border-radius: 8px;
  }

  .btn-primary:hover {
    background-color: #1e40af;
  }
</style>

<div class="container d-flex align-items-center justify-content-center register-container">
  <div class="col-lg-6 col-md-8">
    <div class="card finance-card">
      <div class="card-body p-5">
<br><br><br><br>
        <div class="text-center mb-4">
          <h3 class="finance-title">Create Account</h3>
          <p class="text-muted">Start managing your finances</p>
        </div>

        <form method="POST" action="{% url 'dashboard:userregistration' %}" enctype="multipart/form-data">
          {% csrf_token %}

          <!-- Full Name -->
          <div class="mb-3">
            <label>Full Name</label>
            <input class="form-control" name="name" type="text"
              required pattern="^[A-Z][a-zA-Z\s]*$"
              title="Name must start with a capital letter and contain only letters.">
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label>Email Address</label>
            <input class="form-control" name="email" type="email" required>
          </div>

          <!-- Mobile -->
          <div class="mb-3">
            <label>Mobile Number</label>
            <input class="form-control" name="contact" type="text"
              required pattern="[0-9]{10}"
              title="Enter valid 10-digit mobile number">
          </div>

          <!-- Username -->
          <div class="mb-3">
            <label>Username</label>
            <input type="text" class="form-control" name="username" required>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label>Password</label>
            <input class="form-control" name="password" type="password"
              required minlength="8">
          </div>

          <!-- Profile Image -->
          <div class="mb-3">
            <label>Profile Image</label>
            <input type="file" class="form-control" name="img">
          </div>

          <!-- Address -->
          <div class="mb-3">
            <label>Address</label>
            <textarea class="form-control" name="address" rows="3" required></textarea>
          </div>

          <!-- Location -->
          <div class="mb-4">
            <label>Location</label>
            <select name="location" class="form-select" required>
              <option value="">Select Location</option>
              {% for i in list %}
                <option value="{{ i.id }}">{{ i.name }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Submit -->
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
              Create Account
            </button>
          </div>

          <!-- Login Link -->
          <div class="text-center mt-3">
            <small class="text-muted">
              Already have an account?
              <a href="{% url 'dashboard:loginf' %}" class="fw-semibold text-decoration-none">
                Login
              </a>
            </small>
          </div>

        </form>

      </div>
    </div>
  </div>
</div>

{% include 'Layout/Partials/Guest/footer.html' %}
