{% load static %}
{% include 'Layout/Partials/Guest/header.html' %}

<style>
  body {
    background-color: #f4f6f9;
  }
  .finance-card {
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
  }
  .finance-title {
    font-weight: 700;
    color: #1f2937;
  }
  .form-control, .form-select {
    border-radius: 10px;
    padding: 12px 14px;
  }
</style>

<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="col-lg-5 col-md-7">
    <div class="card finance-card border-0">
      <div class="card-body p-5">

        <div class="text-center mb-4">
          <br><br><br>
          <h3 class="finance-title">Create Account</h3>
          <p class="text-muted">Start managing your finances</p>
        </div>

        <form method="POST" action="{% url 'dashboard:userregistration' %}" enctype="multipart/form-data">
          {% csrf_token %}

          <!-- Name -->
          <div class="mb-3">
            <input type="text" class="form-control" name="name" placeholder="Full Name" required>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <input type="email" class="form-control" name="email" placeholder="Email Address" required>
          </div>

          <!-- Contact -->
          <div class="mb-3">
            <input type="text" class="form-control" name="contact" placeholder="Phone Number" required>
          </div>

          <!-- Username -->
          <div class="mb-3">
            <input type="text" class="form-control" name="username" placeholder="Username" required>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <input type="password" class="form-control" name="password" placeholder="Password" required>
          </div>

          <!-- Profile Image -->
          <div class="mb-3">
            <input type="file" class="form-control" name="img">
          </div>

          <!-- Address -->
          <div class="mb-3">
            <input type="text" class="form-control" name="address" placeholder="Address">
          </div>

          <!-- Location -->
          <div class="mb-4">
            <select name="location" class="form-select" required>
              <option value="">Select Location</option>
              {% for i in list %}
                <option value="{{ i.id }}">{{ i.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-dark btn-lg rounded-pill">
              Create Account
            </button>
          </div>

          <div class="text-center mt-3">
            <small class="text-muted">
              Already have an account? <a href="{% url 'dashboard:loginf' %}" class="fw-semibold text-decoration-none">Login</a>
            </small>
          </div>

        </form>

      </div>
    </div>
  </div>
</div>

{% include 'Layout/Partials/Guest/footer.html' %}
